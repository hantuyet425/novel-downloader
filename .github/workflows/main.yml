name: Run Novel Downloader

on:
  workflow_dispatch:
    inputs:
      novel_url:
        description: 'Nhập Link/URL truyện cần cào'
        required: true
        type: string

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Download Novel
        run: |
          python -m novel_downloader "${{ github.event.inputs.novel_url }}"

      - name: Upload Novel Result
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: downloaded-novel
          path: |
            *.txt
            *.epub
            *.mobi
